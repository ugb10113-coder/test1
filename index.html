<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой первый файл</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background: radial-gradient(ellipse at 18% 15%, #34255780, transparent 55%),
                  radial-gradient(ellipse at 85% 85%, #123c5280, transparent 55%),
                  linear-gradient(135deg, #080b17, #19152c 55%, #081822);
      color: #f6f4ff;
    }
    main { width: min(100%, 960px); text-align: center; animation: appear 1.3s ease-out both; }
    .eyebrow { margin: 0 0 28px; color: #b3a7de; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; }
    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 76px);
      line-height: 1.13;
      font-weight: 650;
      letter-spacing: -.045em;
      text-wrap: balance;
      text-shadow: 0 0 28px #a28cff38, 0 0 70px #8060e51f;
    }
    h1 span { color: #c3b4ff; }
    button {
      margin-top: 44px;
      padding: 17px 30px;
      border: 1px solid #cbbaff55;
      border-radius: 999px;
      background: linear-gradient(135deg, #9e7df1, #7354ce);
      color: white;
      font: 600 16px/1.4 "Segoe UI", Arial, sans-serif;
      box-shadow: 0 8px 36px #9065ef30;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 12px 42px #a47aff55; }
    button:active { transform: translateY(0) scale(.97); }
    button:focus-visible { outline: 3px solid #ded4ff; outline-offset: 6px; }
    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    @keyframes appear { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      button { transition: none; }
      button:hover, button:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Маленькое начало · Большие возможности</p>
    <h1><span>Привет!</span> Это мой первый файл, который собрал ИИ-агент</h1>
    <button type="button" id="celebrate">Нажми меня</button>
  </main>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script>
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    const button = document.getElementById('celebrate');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const colors = ['#c3a6ff', '#83e8e0', '#ffce7b', '#ff8cb8', '#ffffff'];
    let particles = [];
    let frame = null;
    let lastTime = 0;
    let width = 0;
    let height = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function animate(time) {
      const delta = Math.min((time - lastTime) / 16.667, 2);
      lastTime = time;
      ctx.clearRect(0, 0, width, height);
      particles = particles.filter(p => p.life > 0 && p.y < height + 30);
      for (const p of particles) {
        p.life -= delta;
        p.x += p.vx * delta;
        p.y += p.vy * delta;
        p.vy += .13 * delta;
        p.vx *= Math.pow(.992, delta);
        p.angle += p.spin * delta;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 35));
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }
      if (particles.length) frame = requestAnimationFrame(animate);
      else { frame = null; ctx.clearRect(0, 0, width, height); }
    }

    button.addEventListener('click', () => {
      if (!ctx) return;
      const rect = button.getBoundingClientRect();
      const gentle = reducedMotion.matches;
      const count = gentle ? 24 : 150;
      particles = particles.slice(-450);
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - .5) * 2.4;
        const speed = gentle ? 1.5 : 5 + Math.random() * 10;
        particles.push({
          x: rect.left + rect.width / 2 + (gentle ? (Math.random() - .5) * 180 : 0),
          y: rect.top,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 5 + Math.random() * 7,
          angle: Math.random() * Math.PI,
          spin: gentle ? 0 : (Math.random() - .5) * .2,
          life: gentle ? 25 : 140 + Math.random() * 50,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      if (frame === null) { lastTime = performance.now(); frame = requestAnimationFrame(animate); }
    });
    if (ctx) { resize(); window.addEventListener('resize', resize); }
  </script>
</body>
</html>
